name: Check PathMX course

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install PathMX CLI
        run: bun add --global @fellowhumans/pathmx@0.3.0
      - name: Build the learner course
        run: pathmx build paths/index.path.md -o .pathmx-check --clean
